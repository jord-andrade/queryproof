[project]
name = "queryproof"
version = "1.0.0"
description = "Traceable analytics over a synthetic support dataset"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "duckdb==1.5.6",
  "fastapi==0.162.0",
  "pydantic==2.14.2",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "httpx2==2.16.0",
  "mypy==2.4.1",
  "pip-audit==2.10.1",
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["api", "queryproof", "scripts"]

[[tool.mypy.overrides]]
module = "duckdb"
ignore_missing_imports = true
